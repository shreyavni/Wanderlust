name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      # Step 1: Checkout the code from Wanderlust
      - uses: actions/checkout@v4
      
      # Step 2: Use YOUR newly created custom action!
      - name: Run Gemini PR Reviewer
        uses: shreyavni/PR-Review-Agent@main # <-- This points to YOUR repo!
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
