name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    
    # These permissions are required for the bot to post a comment
    permissions:
      pull-requests: write
      contents: read
      issues: write # Added this just to be safe, as PR comments use the Issues API!

    steps:
      # Step 1: Checkout the Wanderlust code
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # Step 2: Run your custom action from the CodEra repository
      - name: Run Gemini PR Review Agent
        uses: shreyavni/CodEra@main 
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
